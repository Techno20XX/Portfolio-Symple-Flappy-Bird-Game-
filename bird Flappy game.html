<!DOCTYPE html>
<html>
<head>
    <title>Simple Flappy Game</title>
    <style>
        canvas {
            display: block;
            margin: 0 auto;
            background: #87CEEB;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Bird
        const bird = { x: 50, y: 150, width: 20, height: 20, velocityY: 0 };
        const gravity = 0.5;
        const jump = -8;

        // Pipes
        let pipes = [];
        let score = 0;

        function drawBird() {
            ctx.fillStyle = 'yellow';
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
        }

        function drawPipes() {
            ctx.fillStyle = 'green';
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.topHeight);
                ctx.fillRect(pipe.x, pipe.topHeight + pipe.gap, pipe.width, canvas.height - pipe.topHeight - pipe.gap);
            });
        }

        function updateGame() {
            bird.velocityY += gravity;
            bird.y += bird.velocityY;

            if (pipes.length === 0 || pipes[pipes.length - 1].x < 150) {
                pipes.push({
                    x: canvas.width,
                    width: 50,
                    topHeight: Math.random() * 200 + 50,
                    gap: 100
                });
            }

            pipes = pipes.filter(pipe => {
                pipe.x -= 3;
                return pipe.x > -50;
            });

            // Collision detection
            pipes.forEach(pipe => {
                if (bird.x < pipe.x + pipe.width && bird.x + bird.width > pipe.x) {
                    if (bird.y < pipe.topHeight || bird.y + bird.height > pipe.topHeight + pipe.gap) {
                        resetGame();
                    }
                }
            });

            if (bird.y > canvas.height || bird.y < 0) {
                resetGame();
            }

            score++;
        }

        function resetGame() {
            bird.y = 150;
            bird.velocityY = 0;
            pipes = [];
            score = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBird();
            drawPipes();
            ctx.fillStyle = 'black';
            ctx.font = '20px Arial';
            ctx.fillText(`Score: ${Math.floor(score / 10)}`, 10, 30);
        }

        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('click', () => {
            bird.velocityY = jump;
        });

        gameLoop();
    </script>
</body>
</html>
